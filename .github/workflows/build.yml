name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ReVanced APK
        uses: j-hc/revanced-magisk-module@v2
        with:
          app-name: youtube
          app-version: 21.32.4
          build-type: apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: revanced-apk
          path: build/
