name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Download CLI (fixed)
        run: |
          curl -L -o cli.jar https://github.com/revanced/revanced-cli/releases/download/v4.6.0/revanced-cli-4.6.0-all.jar

      - name: Download patches (ZIP → extract)
        run: |
          curl -L -o patches.zip https://github.com/revanced/revanced-patches/releases/latest/download/revanced-patches.zip
          unzip patches.zip
          mv revanced-patches-*/revanced-patches-*.jar patches.jar

      - name: Download YouTube APK
        run: |
          curl -L -o youtube.apk https://github.com/revanced/revanced-patches/releases/download/v2.196.0/youtube.apk

      - name: Patch APK
        run: |
          java -jar cli.jar patch youtube.apk -o revanced.apk -b patches.jar

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: revanced-apk
          path: revanced.apk
